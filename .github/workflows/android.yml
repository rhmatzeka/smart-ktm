name: Android APK

on:
  push:
    branches: [master]
    paths: ['mobile/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      # Kunci tanda tangan tetap (secret DEBUG_KEYSTORE, base64), supaya APK baru bisa menimpa versi lama
      # tanpa uninstall. Tanpa secret, Gradle membuat kunci acak per build.
      - name: Kunci tanda tangan tetap
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
        if: env.DEBUG_KEYSTORE != ''
        run: mkdir -p ~/.android && echo "$DEBUG_KEYSTORE" | base64 -d > ~/.android/debug.keystore
      - name: Ikon dan splash dari mobile/assets
        run: npx -y @capacitor/assets@3.0.5 generate --android --iconBackgroundColor '#1747C9' --splashBackgroundColor '#1747C9'
      - run: npx cap sync android
      - name: Build APK
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartKTM-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Rilis "apk-terbaru"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk SmartKTM.apk
          gh release delete apk-terbaru -y --cleanup-tag || true
          gh release create apk-terbaru SmartKTM.apk --title "Smart KTM untuk Android" --notes "APK dari commit ${GITHUB_SHA::7}."
